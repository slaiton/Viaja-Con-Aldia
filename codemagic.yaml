workflows:
  ios-workflow:
    name: Viaja con Aldia iOS (Prebuilt)

    environment:
      node: 20
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.viajaconaldia.id

    scripts:
      - name: Install Node dependencies
        script: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync ios

      - name: Install CocoaPods
        working_directory: ios/App
        script: |
          pod install

      - name: Force iOS signing settings
        script: |
          PROJECT_FILE=ios/App/App.xcodeproj/project.pbxproj
      
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = $APPLE_TEAM_ID/g" $PROJECT_FILE || true
          sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g" $PROJECT_FILE || true
          sed -i '' "s/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g" $PROJECT_FILE || true
      
      - name: Build iOS archive
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            -exportPath $CM_BUILD_DIR/export \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - $CM_BUILD_DIR/export/*.ipa
      - $CM_BUILD_DIR/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false