<ng-container *ngIf="state$ | async as state">
  <ion-header class="ion-no-border">
    <div class="reg-header aldia-header-pattern">
      <div class="reg-header-row">
        <div>
          <span class="reg-brand-sub">Viaja con Aldia</span>
          <h1 class="reg-brand-title">Registro de Conductor</h1>
          <p class="reg-brand-meta" *ngIf="state.tramite?.placa || state.placaActiva || state.cedulaActiva">
            <span *ngIf="state.tramite?.placa || state.placaActiva">Placa {{ state.tramite?.placa || state.placaActiva }}</span>
            <span *ngIf="(state.tramite?.placa || state.placaActiva) && state.cedulaActiva"> · </span>
            <span *ngIf="state.cedulaActiva">CC {{ state.cedulaActiva }}</span>
          </p>
        </div>

        <ion-button
          *ngIf="state.estadoRegistro !== 'SIN_SESION'"
          fill="outline"
          color="light"
          size="small"
          class="btn-salir"
          (click)="onCerrarSesion()"
        >
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          Salir
        </ion-button>
      </div>
    </div>

    <div *ngIf="state.estadoRegistro === 'BORRADOR'" class="reg-progress-bar-wrap">
      <div class="reg-progress-head">
        <span class="reg-progress-label">Paso {{ numeroEtapa(state.etapaActual) }} de 4: {{ tituloEtapa(state.etapaActual) }}</span>
        <span class="reg-progress-pct">{{ numeroEtapa(state.etapaActual) * 25 }}%</span>
      </div>
      <ion-progress-bar [value]="numeroEtapa(state.etapaActual) / 4" color="primary"></ion-progress-bar>

      <div class="steps-nav">
        <button
          type="button"
          class="step-pill"
          [class.step-active]="state.etapaActual === 'conductor'"
          (click)="seleccionarEtapa('conductor')"
        >
          <span>1. Conductor</span>
          <ion-icon *ngIf="pasoCompleto(state.pasos, 'CONDUCTOR')" name="checkmark-circle" color="success"></ion-icon>
        </button>

        <button
          type="button"
          class="step-pill"
          [class.step-active]="state.etapaActual === 'vehiculo'"
          [disabled]="!puedeAcceder('vehiculo', state.tramite)"
          (click)="seleccionarEtapa('vehiculo')"
        >
          <span>2. Vehículo</span>
          <ion-icon *ngIf="pasoCompleto(state.pasos, 'VEHICULO')" name="checkmark-circle" color="success"></ion-icon>
        </button>

        <button
          type="button"
          class="step-pill"
          [class.step-active]="state.etapaActual === 'opcionales'"
          [disabled]="!puedeAcceder('opcionales', state.tramite)"
          (click)="seleccionarEtapa('opcionales')"
        >
          <span>3. Opcionales</span>
        </button>

        <button
          type="button"
          class="step-pill"
          [class.step-active]="state.etapaActual === 'documentos'"
          [disabled]="!puedeAcceder('documentos', state.tramite)"
          (click)="seleccionarEtapa('documentos')"
        >
          <span>4. Fotos</span>
        </button>
      </div>
    </div>
  </ion-header>

  <ion-content class="registro-content">
    <div class="registro-body">
      <ion-progress-bar *ngIf="state.cargando" type="indeterminate" class="mb-bar"></ion-progress-bar>

      <div *ngIf="state.errorMensaje && state.estadoRegistro !== 'SIN_SESION'" class="alert-banner alert-danger">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ state.errorMensaje }}</span>
      </div>

      <ng-container [ngSwitch]="state.estadoRegistro">
        <app-paso-otp
          *ngSwitchCase="'SIN_SESION'"
          [cargando]="state.cargando"
          [errorMensaje]="state.errorMensaje"
          [subpaso]="state.subpasoOtp"
          [celularMask]="state.celularEnmascarado"
          [reenviarEnSegundos]="state.reenviarEnSegundos"
          [intentosRestantes]="state.intentosRestantesOtp"
          (solicitarOtp)="onSolicitarOtp($event)"
          (verificarOtp)="onVerificarOtp($event)"
          (cambiarDatos)="onCambiarDatosOtp()"
          (irALogin)="onIrALogin()"
          (limpiarError)="onLimpiarErrorOtp()"
        ></app-paso-otp>

        <app-estado-tramite
          *ngSwitchCase="'ENVIADO'"
          [tramite]="state.tramite!"
          [cargando]="state.cargando"
          (actualizarEstado)="onActualizarEstado()"
          (cerrarSesion)="onCerrarSesion()"
        ></app-estado-tramite>

        <app-estado-tramite
          *ngSwitchCase="'RECHAZADO'"
          [tramite]="state.tramite!"
          [cargando]="state.cargando"
          (reabrir)="onReabrir()"
          (cerrarSesion)="onCerrarSesion()"
        ></app-estado-tramite>

        <ng-container *ngSwitchCase="'BORRADOR'">
          <ng-container [ngSwitch]="state.etapaActual">
            <app-paso-conductor
              *ngSwitchCase="'conductor'"
              [tramite]="state.tramite"
              [guardando]="state.guardando"
              [cargandoCatalogos]="state.cargandoCatalogos"
              [tiposDocumento]="state.catalogos.tiposDocumento"
              [ciudades]="state.catalogos.ciudades"
              [bancos]="state.catalogos.bancos"
              [epsList]="state.catalogos.epsList"
              [arlList]="state.catalogos.arlList"
              [afpList]="state.catalogos.afpList"
              (guardar)="onGuardarConductor($event)"
              (formularioInvalido)="onFormularioInvalido($event)"
            ></app-paso-conductor>

            <app-paso-vehiculo
              *ngSwitchCase="'vehiculo'"
              [tramite]="state.tramite"
              [cedulaConductor]="state.cedulaActiva"
              [guardando]="state.guardando"
              [cargandoCatalogos]="state.cargandoCatalogos"
              [cargandoLineas]="state.cargandoLineas"
              [clasesVehiculo]="state.catalogos.clasesVehiculo"
              [marcas]="state.catalogos.marcas"
              [lineas]="state.lineasVehiculo"
              [carrocerias]="state.catalogos.carrocerias"
              [aseguradoras]="state.catalogos.aseguradoras"
              [colores]="state.catalogos.colores"
              [proveedoresGps]="state.catalogos.proveedoresGps"
              (guardar)="onGuardarVehiculo($event)"
              (marcaCambio)="onMarcaCambio($event)"
              (formularioInvalido)="onFormularioInvalido($event)"
            ></app-paso-vehiculo>

            <app-paso-opcionales
              *ngSwitchCase="'opcionales'"
              [tramite]="state.tramite"
              [guardando]="state.guardando"
              [carrocerias]="state.catalogos.carrocerias"
              [marcas]="state.catalogos.marcas"
              [tiposDocumento]="state.catalogos.tiposDocumento"
              [ciudades]="state.catalogos.ciudades"
              (guardarEntidad)="onGuardarOpcional($event)"
              (quitarEntidad)="onQuitarOpcional($event)"
              (continuar)="onContinuarOpcionales()"
            ></app-paso-opcionales>

            <app-paso-documentos
              *ngSwitchCase="'documentos'"
              [tramite]="state.tramite"
              [pasos]="state.pasos"
              [guardando]="state.guardando"
              [subiendoArchivoKey]="state.subiendoArchivoKey"
              [faltanEnviar]="state.faltanEnviar"
              (subirSoporte)="onSubirSoporte($event)"
              (solicitarEliminarSoporte)="onSolicitarEliminarSoporte($event)"
              (solicitarEnviarTramite)="onSolicitarEnviarTramite()"
              (irAPaso)="seleccionarEtapa($event)"
            ></app-paso-documentos>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>
  </ion-content>
</ng-container>
