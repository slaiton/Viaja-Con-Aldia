<ion-app>
  <app-offline-banner></app-offline-banner>
  <!-- Enrutador Principal -->
  <ion-router-outlet id="main-content" [class.has-bottom-bar]="statusLogin()"></ion-router-outlet>

  <!-- Barra de Navegación Inferior (Mockup v4) -->
  <nav class="aldia-bottom-bar" *ngIf="statusLogin()" role="navigation" aria-label="Navegación principal">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="bottom-tab-item">
      <div class="icon-wrap">
        <ion-icon name="home-outline" class="tab-icon"></ion-icon>
      </div>
      <span class="tab-label">Inicio</span>
    </a>

    <a routerLink="/preform" routerLinkActive="active" class="bottom-tab-item">
      <div class="icon-wrap">
        <ion-icon name="clipboard-outline" class="tab-icon"></ion-icon>
      </div>
      <span class="tab-label">Preoperac.</span>
    </a>

    <a routerLink="/datos" routerLinkActive="active" class="bottom-tab-item tab-documentos">
      <div class="icon-wrap">
        <ion-icon name="document-text-outline" class="tab-icon"></ion-icon>
        <span *ngIf="((totalAlertasDocumentos$ | async) ?? 0) > 0" class="nav-alert-badge">
          {{ totalAlertasDocumentos$ | async }}
        </span>
      </div>
      <span class="tab-label">Documentos</span>
    </a>

    <button type="button" class="bottom-tab-item btn-tab-perfil" (click)="openPerfilMenu()">
      <div class="icon-wrap">
        <ion-icon name="person-circle-outline" class="tab-icon"></ion-icon>
      </div>
      <span class="tab-label">Perfil</span>
    </button>
  </nav>
</ion-app>
